<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="Generator" content="EditPlus®">
    <meta name="Author" content="">
    <meta name="Keywords" content="">
    <meta name="Description" content="">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>LOGIN PAGE</title>
</head>
<body class="bg-light">  


    <div class="vw-100 bg-warning py-3 mb-4">
        <h1 class="fs-4 fs-lg-2 text-center m-0 fw-bold">LOGIN PAGE</h1>
    </div>

 
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow border-0 rounded-4 mt-2 mb-5">
                    <div class="card-body p-4 p-sm-5">
                        <div class="text-center mb-4">
                            <h3 class="fw-bold text-primary">Welcome Back</h3>
                            <p class="text-muted small">Please enter your details to sign in</p>
                        </div>

                        <form onsubmit="return loginuser()">
                            <div class="mb-3 mt-3">
                                <label for="uname" class="form-label">User Name:</label>
                                <input type="text" class="form-control" id="uname" placeholder="Enter your User Name" name="uname">    
                            </div>                           
                            <div class="mb-3">
                                <label for="email" class="form-label">E-mail:</label>
                                <input type="email" id="email" class="form-control" name="email" placeholder="abc@gmail.com">                    
                            </div>                           
                            <div class="mb-3">
                                <label for="pwd" class="form-label">Password:</label>
                                <input type="password" id="pwd" class="form-control" name="pwd" minlength="8" placeholder="Enter your password">                     
                            </div>                           
                            <button type="submit" class="btn btn-primary w-100 py-2 rounded-3 fw-semibold mt-2">Sign In</button>
                 
                            <p class="text-center text-muted small mt-4 mb-0">
                                Don't have an account? <a href="registration.html" class="text-primary text-decoration-none fw-semibold">Sign up</a>
                            </p>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    Bootstrap Script & Custom Validation Logic
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    
    <script>
        function loginuser() {
            const user = document.getElementById("uname").value.trim();
            const email = document.getElementById("email").value.trim();
            const pass = document.getElementById("pwd").value;
            
            // 1. Check if Username is empty
            if (user === "") {
                alert("Please enter your User Name.");
                document.getElementById("uname").focus();
                return false;
            }
            
            // 2. Check if Email is empty
            if (email === "") {
                alert("Please enter your E-mail address.");
                document.getElementById("email").focus();
                return false;
            }
            
            // Basic Email Pattern Validation
            const emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
            if (!email.match(emailPattern)) {
                alert("Please enter a valid E-mail address.");
                document.getElementById("email").focus();
                return false;
            }

            // 3. Check if Password is empty
            if (pass === "") {
                alert("Please enter your Password.");
                document.getElementById("pwd").focus();
                return false;
            }
            
            // 4. Check Password Minimum Length (8 characters)
            if (pass.length < 8) {
                alert("Password must be at least 8 characters long.");
                document.getElementById("pwd").focus();
                return false;
            }
            
            // If all validations pass
            alert("Login successful!");
            return true;
        }
    </script>
</body>
</html>
