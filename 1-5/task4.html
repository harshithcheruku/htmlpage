
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Scientific Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #e8eef5;
            display: flex;
            justify-content: center;
            padding: 30px 10px;
        }

        .calculator {
            background: #202938;
            padding: 20px;
            border-radius: 15px;
            width: 340px;
        }

        h2 {
            text-align: center;
            color: white;
        }

        #display {
            width: 100%;
            height: 55px;
            box-sizing: border-box;
            margin-bottom: 15px;
            text-align: right;
            font-size: 23px;
            padding: 10px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        button {
            padding: 15px 5px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            background: #e2e8f0;
        }

        button:hover {
            background: #a5c8f5;
        }

        .operator {
            background: #f0b44d;
        }

        .equal {
            background: #49b675;
        }

        .clear {
            background: #ef7272;
        }
    </style>
</head>
<body>

<div class="calculator">
    <h2>Scientific Calculator</h2>

    <input type="text" id="display" value="0" readonly>

    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">AC</button>
        <button onclick="del()">DEL</button>
        <button onclick="scientific('sqrt')">√</button>
        <button class="operator" onclick="append('/')">÷</button>

        <button onclick="scientific('sin')">sin</button>
        <button onclick="scientific('cos')">cos</button>
        <button onclick="scientific('tan')">tan</button>
        <button class="operator" onclick="append('*')">×</button>

        <button onclick="scientific('log')">log</button>
        <button onclick="scientific('ln')">ln</button>
        <button onclick="append('**')">xʸ</button>
        <button class="operator" onclick="append('-')">−</button>

        <button onclick="append('7')">7</button>
        <button onclick="append('8')">8</button>
        <button onclick="append('9')">9</button>
        <button class="operator" onclick="append('+')">+</button>

        <button onclick="append('4')">4</button>
        <button onclick="append('5')">5</button>
        <button onclick="append('6')">6</button>
        <button onclick="append('(')">(</button>

        <button onclick="append('1')">1</button>
        <button onclick="append('2')">2</button>
        <button onclick="append('3')">3</button>
        <button onclick="append(')')">)</button>

        <button onclick="append('0')">0</button>
        <button onclick="append('.')">.</button>
        <button onclick="append('Math.PI')">π</button>
        <button class="equal" onclick="calculate()">=</button>
    </div>
</div>

<script>
    let display = document.getElementById("display");
    let expression = "";

    function update() {
        display.value = expression || "0";
    }

    function append(value) {
        expression += value;
        update();
    }

    function clearDisplay() {
        expression = "";
        update();
    }

    function del() {
        expression = expression.slice(0, -1);
        update();
    }

    function calculate() {
        try {
            if (!/^[0-9+\-*/().\s]*$/.test(
                expression.replace(/Math\.PI/g, "")
            )) {
                throw new Error("Invalid expression");
            }

            if (!expression || !/[\d)]$/.test(expression)) {
                throw new Error("Invalid expression");
            }

            let result = Function(
                '"use strict"; return (' + expression + ')'
            )();

            if (!Number.isFinite(result)) {
                throw new Error("Invalid result");
            }

            expression = String(Number(result.toPrecision(12)));
            update();
        } catch (e) {
            display.value = "Error";
            expression = "";
        }
    }

    function scientific(operation) {
        try {
            if (!expression || !/^[0-9.]+$/.test(expression)) {
                throw new Error("Enter a number first");
            }

            let n = Number(expression);
            let result;

            switch (operation) {
                case "sqrt":
                    result = Math.sqrt(n);
                    break;
                case "sin":
                    result = Math.sin(n * Math.PI / 180);
                    break;
                case "cos":
                    result = Math.cos(n * Math.PI / 180);
                    break;
                case "tan":
                    result = Math.tan(n * Math.PI / 180);
                    break;
                case "log":
                    result = Math.log10(n);
                    break;
                case "ln":
                    result = Math.log(n);
                    break;
            }

            if (!Number.isFinite(result)) {
                throw new Error("Invalid result");
            }

            expression = String(Number(result.toPrecision(12)));
            update();
        } catch (e) {
            display.value = "Error";
            expression = "";
        }
    }
</script>

</body>
</html>
