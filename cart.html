<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CART</title>
    <style>
        table {
            border-collapse: collapse;
            margin-left: auto;
            margin-right: auto;
            background-color: #f8e5a7c9;
            font-weight: bold;
        }
        th, td {
            text-align: center;
            vertical-align: middle;
            padding: 15px;
        }
        th {
            background-color: #f2f2f2;
        }
        body{
            background-color: #a9cd91;
        }
    </style>
</head>
<body align="center">
    <h1>YOUR CART</h1>
    <table width="90%" border="1">
        <thead>
            <th>S.NO</th>
            <th>BOOK NAME</th>
            <th>PRICE</th>
        </thead>
        <tbody id="cartItems">
        <tr>
            <td>1.</td>
            <td>BASICS OF COMPUTER ENGINEERING</td>
            <td>₹450</td>
        </tr>
        <tr>
            <td>2.</td>
            <td>ANALOG CIRCUITS</td>
            <td>₹400</td>
        </tr>
        <tr>
            <td>3.</td>
            <td>ADVANCED ALGORITHMS FOR AIML</td>
            <td>₹650</td>
        </tr>
        </tbody>
    </table>
</body>
</html>
